name: Compilar MicroWord APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Instalar Capacitor y crear proyecto Android
        run: |
          npm install
          npx cap add android

      - name: 5. Poner el icono de la app (logo.png) automáticamente
    run: |
      mkdir -p assets
      cp www/logo.png assets/icon.png
      cp www/logo.png assets/splash.png
      npx capacitor-assets generate --android --iconBackgroundColor '#185ABD' --splashBackgroundColor '#185ABD'
      
      - name: 6. Sincronizar archivos web offline (index.html)
        run: npx cap sync android

      - name: 7. Compilar el instalador APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Entregar archivo MicroWord-NART.apk listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MicroWord-NART-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk